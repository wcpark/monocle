
---
name: CI Pipeline

on:
  push:
    branches:
      - "**"

  workflow_dispatch:
    inputs:
      sbom_scan_failure_threshold:
        description: "Threshold to fail the SBOM scan."
        type: choice
        options:
          - low
          - medium
          - high
          - critical
        default: medium

  schedule:
    - cron: "00 12 * * *"

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    env:
      GRYPE_FAILURE_THRESHOLD: ${{ github.event.inputs.sbom_scan_failure_threshold || 'medium' }}

    steps:
      - name: Clone Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set Up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: latest-known

      - name: Install Tools
        run: |
          make install-tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Environment
        run: cp src/.env.example src/.env

      - name: Run CI Pipeline
        run: make test-container
